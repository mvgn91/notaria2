<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Fondo marfil -->
  <rect width="32" height="32" fill="#F5F5DC"/>
  
  <!-- Círculo exterior verde -->
  <circle cx="16" cy="16" r="12" fill="#4CAF50"/>
  
  <!-- Círculo interior más claro -->
  <circle cx="16" cy="16" r="10" fill="#66BB6A"/>
  
  <!-- Número "80" en el centro -->
  <text x="16" y="16" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="white">80</text>
  
  <!-- Borde sutil -->
  <rect width="32" height="32" fill="none" stroke="#E0E0E0" stroke-width="1"/>
</svg>
